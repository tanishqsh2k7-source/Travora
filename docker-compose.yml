services:
  mongo:
    image: mongo:7
    container_name: travora-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      # No auth for local dev; add MONGO_INITDB_ROOT_USERNAME/PASSWORD for staging
      MONGO_INITDB_DATABASE: travora
    restart: unless-stopped

volumes:
  mongo-data:

